# Relative pronouns: som
# Scope: a relative pronoun (PronType=Rel) dependent on the verb of a
#        relative clause (acl:relcl).
# Conclusion: the pronoun has the lemma "som".
# For the pronoun X only its relation and position are used as features;
# its morphology is not. Gender and case rules therefore concern the
# antecedent (CLH), not the pronoun.

scope: pattern { X[upos=PRON, PronType=Rel]; V[upos=VERB]; CLH-[acl:relcl]->V; V->X }
conclusion: X[lemma="som"]

templates:
    base:
        own:
            method: include
            regexp: ["rel.*", "position"]
        prev:
            method: include
            regexp: ["upos", "rel.*", "position"]
        next:
            method: include
            regexp: ["upos", "rel.*", "position"]

features:
    X: base
    V:
        own:
            method: exclude
            regexp: ["form", "textform", "wordform", "lemma", "SpaceAfter", "Typo", "Correct.*", "xpos", "upos", "rel.*", "__RAW_MISC__"]
        prev:
            method: include
            regexp: ["upos", "rel.*", "position"]
        next:
            method: include
            regexp: ["upos", "rel.*", "position"]
    CLH:
        own:
            method: exclude
            regexp: ["form", "textform", "wordform", "lemma", "SpaceAfter", "Typo", "Number", "upos", "Correct.*", "xpos", "rel.*", "__RAW_MISC__"]
    sentence:
        meta:
            method: include
            regexp: ["period"]